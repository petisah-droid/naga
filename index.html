<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.A.G.A — Sovereign Digital Infrastructure & Executive Advisory</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #070709;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Gold Gradient Text */
        .text-gold {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 30%, #b38728 70%, #fbf5b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99;
            background: rgba(7, 7, 9, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #11131b;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .brand-badge span {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: #d4af37;
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            font-size: 1.1rem;
        }

        .nav-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #f7e7ce;
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #d4af37;
            color: #070709;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 60px;
            position: relative;
            z-index: 10;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 40px 0 60px;
        }

        .tagline {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(17, 19, 27, 0.8);
            color: #d4af37;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 6vw, 3.8rem);
            font-weight: 900;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto 36px;
            font-weight: 300;
        }

        .hero-btn {
            display: inline-block;
            background: linear-gradient(135deg, #bf953f 0%, #d4af37 50%, #aa7c11 100%);
            color: #070709;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        /* Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin: 50px 0;
        }

        .card {
            background: rgba(17, 19, 27, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }

        .card h3 {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .card p {
            color: #8e8e93;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Form Card */
        .form-card {
            background: rgba(17, 19, 27, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 36px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-top: 40px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h2 {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #8e8e93;
            font-size: 0.85rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: #d4af37;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.08);
